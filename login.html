<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login</title>
  <link rel="stylesheet" href="dist/test.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
</head>

<body class="bg-bg text-gray-800 font-sans flex flex-col min-h-screen">
  <!-- HEADER -->
  <header class="header py-4 shadow-md">
    <div class="flex items-center">
      <a href="https://storefrontsolutions.shop/">
        <img src="images/logo.png" width="260" height="75" alt="Welcome" class="h-12 ml auto">
      </a>
    </div>
    <div class="container mx-auto flex justify-between items-center"></div>
  </header>

  <!-- BODY -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <canvas id="particle-canvas"></canvas>
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-md">
      <h1 class="page-title text-3xl font-semibold text-gray-900 mb-4">
        Log In
      </h1>
      <p class="text-gray-600 mb-6">
        Log in with your email or username.
      </p>

      <form id="loginForm" class="space-y-4 text-left">
        <div class="form-group">
          <label class="label" for="user_id">Email or Username</label>
          <input
            type="text"
            id="user_id"
            name="user_id"
            class="input"
            placeholder="you@example.com or username"
            required
          >
        </div>

        <div class="form-group">
          <label class="label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input"
            placeholder="Your password"
            required
          >
        </div>

        <p id="loginMessage" class="text-sm mt-2 text-red-600"></p>

        <button
          type="submit"
          class="btn btn primary w-full mt-6">
          Log In
        </button>
        </p>
      </form>
    </div>
    <script src="dist/particles.js"></script>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const backendBase = "https://pointofsalebackendapi.onrender.com";

    loginForm.addEventListener("submit", async (e) => {
      if (!loginForm.checkValidity()) {
        e.preventDefault();
        loginForm.reportValidity();
        return;
      }

      e.preventDefault();
      loginMessage.textContent = "";

      const usernameOrEmail = document.getElementById("user_id").value.trim();
      const password = document.getElementById("password").value;

      try {
        const resp = await fetch(`${backendBase}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernameOrEmail, password })
        });

        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          if (resp.status === 403 && data.needsVerification) {
            loginMessage.textContent =
              "Your email is not verified yet. Please check your inbox for the verification email.";
          } else {
            loginMessage.textContent =
              data.error || "Login failed. Please check your credentials.";
          }
          return;
        }

        // Success – you could store data.user in localStorage if you want
        window.location.href = "Online Storefront Page.html";
      } catch (err) {
        console.error("Error calling /auth/login:", err);
        loginMessage.textContent =
          "Network error while logging in. Please try again.";
      }
    });
  </script>
</body>
</html>
