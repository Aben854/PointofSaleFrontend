<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Storefront</title>
  <link rel="stylesheet" href="dist/storefront.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
</head>

<body>

<!-- HEADER (invisible bar but still holds logo + cart icon) -->
<header class="header">
  <div class="header-inner">
    <!-- Logo -->
    <a href="https://storefrontsolutions.shop/" class="logo-link">
      <img
        src="images/logo.png"
        width="260"
        height="75"
        alt="Storefront Solutions"
        class="logo-img"
      >
    </a>

    <!-- Cart icon: opens / closes drawer -->
    <button class="cart-icon-button" type="button" onclick="toggleCartDrawer()">
      <img
        id="cartIconImage"
        src="images/empty shopping cart.png"
        alt="Shopping cart"
        class="cart-icon-img"
      >
    </button>
  </div>
</header>


  <!-- MAIN CONTENT -->
  <canvas id="particle-canvas"></canvas>

  <main class="page-layout">
    <!-- PRODUCTS SECTION -->
    <section class="products-wrapper">
      <h2 class="section-title">Products</h2>

      <div class="product-grid">
        <!-- Product 1 -->
        <article class="product-card">
          <img src="images/laptop.png" alt="Shirt" class="product-image">
          <h3 class="product-name">Laptop</h3>
          <p class="product-price">$200.00</p>
          <button class="btn-primary" onclick="addToCart('Shirt', 200)">
            Add to Cart
          </button>
        </article>

        <!-- Product 2 -->
        <article class="product-card">
          <img src="images/sofa.png" alt="Pants" class="product-image">
          <h3 class="product-name">Sofa</h3>
          <p class="product-price">$150.00</p>
          <button class="btn-primary" onclick="addToCart('Pants', 150)">
            Add to Cart
          </button>
        </article>

                <article class="product-card">
          <img src="images/shirt.png" alt="Pants" class="product-image">
          <h3 class="product-name">Shirt</h3>
          <p class="product-price">$15.00</p>
          <button class="btn-primary" onclick="addToCart('Pants', 15)">
            Add to Cart
          </button>
        </article>
                <article class="product-card">
          <img src="images/monitor.png" alt="Pants" class="product-image">
          <h3 class="product-name">Monitor</h3>
          <p class="product-price">$100.00</p>
          <button class="btn-primary" onclick="addToCart('Pants', 100)">
            Add to Cart
          </button>
        </article>
                <article class="product-card">
          <img src="images/table.png" alt="Pants" class="product-image">
          <h3 class="product-name">Table</h3>
          <p class="product-price">$50.00</p>
          <button class="btn-primary" onclick="addToCart('Pants', 50)">
            Add to Cart
          </button>
        </article>
        <!-- Add more products here by copying a product-card block -->
      </div>
    </section>

<!-- CART OVERLAY + SLIDE-IN SIDEBAR -->
<div id="cartOverlay" class="cart-overlay" onclick="toggleCartDrawer()"></div>

<aside id="cartDrawer" class="cart-drawer">
  <div class="cart-drawer-header">
    <h2 class="cart-title">Your Cart</h2>
    <button class="cart-close-btn" type="button" onclick="toggleCartDrawer()">✕</button>
  </div>

  <ul id="cartItems" class="cart-items-list">
    <!-- JS injects <li> items -->
  </ul>

  <p class="cart-total">
    Total: $<span id="cartTotal">0.00</span>
  </p>

  <button class="btn-primary btn-full" onclick="checkout()">
    Checkout Items
  </button>
</aside>

  <!-- FOOTER (minimal, you can add content) -->
  <footer class="footer"></footer>

  <!-- JAVASCRIPT -->
  <script>
    // In-memory cart
    let cart = [];

    // Add item and refresh UI
    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartDisplay();
      updateCartIcon();
    }

    // Remove item by index
    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartDisplay();
      updateCartIcon();
    }

        // Open/close the slide-in cart drawer
    function toggleCartDrawer() {
      const drawer = document.getElementById("cartDrawer");
      const overlay = document.getElementById("cartOverlay");
      if (!drawer || !overlay) return;

      drawer.classList.toggle("open");
      overlay.classList.toggle("show");
    }

    // Update list + total in sidebar
    function updateCartDisplay() {
      const cartList = document.getElementById("cartItems");
      const totalDisplay = document.getElementById("cartTotal");

      cartList.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        const li = document.createElement("li");
        li.className = "cart-item";

        li.innerHTML = `
          <span class="cart-item-name">${item.name}</span>
          <span class="cart-item-price">$${item.price.toFixed(2)}</span>
          <button class="cart-remove-btn" type="button" onclick="removeFromCart(${index})">
            ✕
          </button>
        `;

        cartList.appendChild(li);
      });

      totalDisplay.textContent = total.toFixed(2);
    }

    // Swap cart icon image depending on whether cart has items
 function updateCartIcon() {
  const icon = document.getElementById("cartIconImage");
  if (!icon) return;

  const hasItems = cart.length > 0;

  icon.src = hasItems
    ? "images/full shopping cart.gif"     // cart HAS items
    : "images/empty shopping cart.png";   // cart is empty (default)
}


    // Checkout: validate and send data to next page
    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty. Please add at least one item before checking out.");
        return;
      }

      localStorage.setItem("cartData", JSON.stringify(cart));
      localStorage.setItem("cartTotal", document.getElementById("cartTotal").textContent);

      // Redirect to payment / confirmation page
      window.location.href = "Enter credit card info page.html";
    }
  </script>

  <script src="dist/particles.js"></script>
</body>
</html>
