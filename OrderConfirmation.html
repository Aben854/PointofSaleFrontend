<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="dist/test.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body class="bg-[var(--color-bg)] text-gray-800 font-sans flex flex-col min-h-screen">
  <canvas id="particle-canvas"></canvas>
  <!-- HEADER -->
  <header class="header py-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="storefrontsolutions.shop" class="logo-link">
          <img
            src="images/logo.png"
            width="260"
            height="75"
            alt="Storefront Solutions"
            class="logo-img">
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h2 class="page-title text-3xl font-semibold text-gray-900 mb-4">
        Congratulations!
      </h2>

      <p class="text-gray-600 mb-6">
        Your order has been completed. Please wait, and enjoy!
      </p>

      <br>
        <!-- Back to Storefront button -->
        <a
          href="Online Storefront Page.html"
          class="btn btn-secondary w-full inline-block text-center">
          Back to Storefront
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>
  <script src="dist/particles.js"></script>
</body>
</html>
