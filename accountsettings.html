<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Account Details</title>
  <link rel="stylesheet" href="dist/test.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
</head>

<body class="bg-bg text-gray-800 font-sans flex flex-col min-h-screen">
  <!-- HEADER -->
  <header class="header py-4 shadow-md">
    <div class="flex items-center">
      <a href="https://storefrontsolutions.shop/">
        <img src="images/logo.png" width="260" height="75" alt="Welcome" class="h-12 ml-auto">
      </a>
    </div>
    <div class="container mx-auto flex justify-between items-center"></div>
  </header>

  <!-- BODY -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <canvas id="particle-canvas"></canvas>

    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h1 class="page-title fade-in-title text-3xl font-semibold text-gray-900 mb-4">
        Change Account Details
      </h1>
      <p class="text-gray-600 mb-8 subtitle">
        Update your information below and save your changes.
      </p>

      <form id="updateForm" class="signup-form space-y-4 text-left">
        <!-- Name -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="label" for="fName">First Name</label>
            <input
              type="text"
              id="fName"
              name="fName"
              class="input"
              placeholder="John"
              required
            >
          </div>
          <div class="form-group">
            <label class="label" for="lName">Last Name</label>
            <input
              type="text"
              id="lName"
              name="lName"
              class="input"
              placeholder="Doe"
              required
            >
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input"
            placeholder="you@example.com"
            required
          >
        </div>

        <!-- Username -->
        <div class="form-group">
          <label class="label" for="user_id">Username</label>
          <input
            type="text"
            id="user_id"
            name="user_id"
            class="input"
            placeholder="username"
            required
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="label" for="password">New Password (leave blank to keep current)</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input"
            placeholder="Enter a new password"
          >
        </div>

        <!-- Location -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="label" for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              class="input"
              placeholder="GA"
              required
            >
          </div>
          <div class="form-group">
            <label class="label" for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              class="input"
              placeholder="Atlanta"
              required
            >
          </div>
        </div>

        <!-- Address -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="label" for="zip_code">Zip Code</label>
            <input
              type="text"
              id="zip_code"
              name="zip_code"
              class="input"
              placeholder="30301"
              required
            >
          </div>
          <div class="form-group">
            <label class="label" for="address_line1">Address Line 1</label>
            <input
              type="text"
              id="address_line1"
              name="address_line1"
              class="input"
              placeholder="123 Main St"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="label" for="address_line2">Address Line 2</label>
          <input
            type="text"
            id="address_line2"
            name="address_line2"
            class="input"
            placeholder="Apt 4B"
          >
        </div>

        <p id="updateMessage" class="text-sm mt-2"></p>

        <br>
        <!-- Buttons -->
        <div class="mt-8 space-y-3">
          <button
            type="submit"
            class="btn btn primary w-full"
          >
            Save Changes
          </button>

          <button
            type="button"
            class="btn w-full"
            onclick="window.location.href='Online Storefront Page.html'"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>

    <script src="dist/particles.js"></script>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

  <script>
    const updateForm = document.getElementById("updateForm");
    const updateMessage = document.getElementById("updateMessage");
    const backendBase = "https://pointofsalebackendapi.onrender.com";

    updateForm.addEventListener("submit", async (e) => {
      if (!updateForm.checkValidity()) {
        e.preventDefault();
        updateForm.reportValidity();
        return;
      }

      e.preventDefault();
      updateMessage.textContent = "";

      const fName = document.getElementById("fName").value.trim();
      const lName = document.getElementById("lName").value.trim();

      const payload = {
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("user_id").value.trim(),
        full_name: `${fName} ${lName}`.trim(),
        address_line1: document.getElementById("address_line1").value.trim(),
        address_line2: document.getElementById("address_line2").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        zip_code: document.getElementById("zip_code").value.trim()
      };

      const password = document.getElementById("password").value;
      if (password) {
        payload.password = password;
      }

      try {
        const resp = await fetch(`${backendBase}/auth/update`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          updateMessage.textContent = data.error || "Failed to update account.";
          updateMessage.className = "text-sm mt-2 text-red-600";
          return;
        }

        updateMessage.textContent = "Account updated successfully!";
        updateMessage.className = "text-sm mt-2 text-green-600";
        
        // Redirect after a short delay
        setTimeout(() => {
          window.location.href = "Online Storefront Page.html";
        }, 1500);
      } catch (err) {
        console.error("Error updating account:", err);
        updateMessage.textContent = "Network error. Please try again.";
        updateMessage.className = "text-sm mt-2 text-red-600";
      }
    });
  </script>
</body>
</html>
