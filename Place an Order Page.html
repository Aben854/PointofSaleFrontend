<!DOCTYPE html>
<html lang = "en">

<head>
<meta charset="utf-8">    
    <title>Online Storefront</title>
    <link rel="stylesheet" type="text/css" href="../POSFrontend/css/pos3 (place an order).css">
    <link rel="icon" type="image/x-icon" href="../POSFrontend/pics/cart.ico">
    <style>
      .top-right {
      position: absolute;   
      top: 10px;            
      right: 10px;          
      font-size: 18px;
      font-family: Arial, sans-serif;
    }
    </style>    


</head>


<body>
  <a href="../POSFrontend/index.html">
  <img src="../POSFrontend/pics/logo.png" alt="Logo" title="basic logo, will be changed" height="auto">
  </a>
  <h2>Products</h2>
  <div>
    <p>Shirt - $10 <button onclick="addToCart('Shirt', 10)">Add to Cart</button></p>
    <img src="../POSFrontend/pics/shirt.jpg" alt="shirt" title="shirt">
    <p>Jeans - $15 <button onclick="addToCart('Jeans', 15)">Add to Cart</button></p>
    <img src="../POSFrontend/pics/jeans.jpg" alt="jeans" title="jeans">
  </div>

  <section class="top-right">
  <h2>Cart</h2> <img src="../POSFrontend/pics/ordercart.png" alt="cart">
  <ul id="cartItems"></ul>
  <p>Total: $<span id="cartTotal">0</span></p>
  <a href="../POSFrontend/OrderConfirmationPage.html" class="button">Checkout Items</a>
  <!--add function that does not let customer go to order confirmation page and asks the customer to put something in the cart if the cart is empty-->
  </section>
  <script>
    let cart = [];

    function addToCart(name, price) {
      
      cart.push({ name, price });
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const cartList = document.getElementById("cartItems");
      const totalDisplay = document.getElementById("cartTotal");

      cartList.innerHTML = ""; 
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        cartList.innerHTML += `<li>${item.name} - $${item.price} 
          <button onclick="removeFromCart(${index})">Remove</button></li>`;
      });

      totalDisplay.textContent = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartDisplay();
    }
  </script>



</body>







</html>
