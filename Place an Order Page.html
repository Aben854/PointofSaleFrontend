<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Storefront</title>
  <link rel="stylesheet" href="dist/pos.css">
</head>

<body class="bg-[var(--color-bg)] text-gray-800 font-sans flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="header py-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo" class="h-10 w-10 object-contain">
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 container mx-auto py-12 px-4 lg:px-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- PRODUCTS SECTION -->
    <section class="lg:col-span-2">
      <h2 class="text-3xl font-semibold text-gray-900 mb-8">Products</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Product 1 -->
        <div class="card flex flex-col items-center">
          <img src="images/shirt.png" alt="Shirt" class="rounded-lg shadow-soft w-full h-48 object-cover mb-4">
          <h3 class="text-xl font-semibold mb-2">Shirt</h3>
          <p class="text-gray-600 mb-4">$10.00</p>
          <button class="btn btn-primary w-full" onclick="addToCart('Shirt', 10)">Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="card flex flex-col items-center">
          <img src="images/pants.png" alt="Jeans" class="rounded-lg shadow-soft w-full h-48 object-cover mb-4">
          <h3 class="text-xl font-semibold mb-2">Pants</p></h3>
          <p class="text-gray-600 mb-4">$15.00</p>
          <button class="btn btn-primary w-full" onclick="addToCart('Jeans', 15)">Add to Cart</button>
        </div>
      </div>
    </section>

    <!-- CART SECTION -->
    <aside class="card lg:col-span-1 sticky top-6 h-fit">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-semibold">Your Cart🛒</h2>
      </div>

      <ul id="cartItems" class="divide-y divide-gray-200 mb-4"></ul>
      <p class="text-lg font-semibold mb-4">Total: $<span id="cartTotal">0</span></p>

      <button
        class="btn btn-accent w-full"
        onclick="checkout()">
        Checkout Items
      </button>
    </aside>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
  </footer>

  <!-- JAVASCRIPT -->
<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartDisplay();
  }

  function updateCartDisplay() {
    const cartList = document.getElementById("cartItems");
    const totalDisplay = document.getElementById("cartTotal");

    cartList.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;
      cartList.innerHTML += `
        <li class="flex justify-between items-center py-2">
          <span>${item.name} - $${item.price}</span>
          <button class="text-sm text-red-600 hover:underline" onclick="removeFromCart(${index})">Remove</button>
        </li>`;
    });

    totalDisplay.textContent = total;
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartDisplay();
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Your cart is empty. Please add items before checking out.");
      return;
    }

    // Save cart data to localStorage
    localStorage.setItem("cartData", JSON.stringify(cart));
    localStorage.setItem("cartTotal", document.getElementById("cartTotal").textContent);

    // Redirect to confirmation page
    window.location.href = "Enter credit card info.html";
  }
</script>

</body>
</html>
