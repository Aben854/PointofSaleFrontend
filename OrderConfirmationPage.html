<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="dist/test.css">
</head>

<body class="bg-[var(--color-bg)] text-gray-800 font-sans flex flex-col min-h-screen">
  <canvas id="particle-canvas"></canvas>
  <!-- HEADER -->
    <a href="https://storefrontsolutions.shop/" class="logo-link">
      <img
        src="images/logo.png"
        width="260"
        height="75"
        alt="Storefront Solutions"
        class="logo-img">
    </a>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center">
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h2 class="text-3xl font-semibold text-gray-900 mb-4">Order Confirmation</h2>
      <p class="text-gray-600 mb-8">Thank you for your purchase! Please review your details below.</p>

      <div id="orderSummary" class="mb-6 text-left">
        <h3 class="text-xl font-semibold mb-2">Order Summary</h3>
        <ul id="orderItems" class="list-disc pl-5 text-gray-700 mb-4"></ul>
        <p class="text-lg font-semibold text-gray-900">
          Total Amount: $<span id="orderTotal">0</span>
        </p>
      </div>

      <div class="flex flex-col gap-3">
        <button class="btn btn-primary w-full" onclick="window.location.href='paymentauthorization.html'">Confirm Order</button>
        <button class="btn btn-secondary w-full" onclick="window.location.href='Online Storefront Page.html'">Go Back</button>
      </div>
    </div>
  </main>

  <footer class="footer"></footer>

  <!-- SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Retrieve data from localStorage
      const cartData = JSON.parse(localStorage.getItem("cartData")) || [];
      const cartTotal = localStorage.getItem("cartTotal") || "0";

      // Display items
      const orderItems = document.getElementById("orderItems");
      orderItems.innerHTML = "";
      cartData.forEach(item => {
        orderItems.innerHTML += `<li>${item.name} - $${item.price}</li>`;
      });

      // Display total
      document.getElementById("orderTotal").textContent = cartTotal;
    });
  </script>
  <script src="dist/particles.js"></script>
</body>
</html>
