<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Information</title>
  <link rel="stylesheet" href="dist/test.css">
</head>

<body class="bg-[var(--color-bg)] text-gray-800 font-sans flex flex-col min-h-screen">
  <canvas id="particle-canvas"></canvas>

  <!-- HEADER -->
  <a href="https://storefrontsolutions.shop/" class="logo-link">
    <img
      src="images/logo.png"
      width="260"
      height="75"
      alt="Storefront Solutions"
      class="logo-img">
  </a>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h2 class="text-3xl font-semibold text-gray-900 mb-4">Enter your card details.</h2>
      <p class="text-gray-600 mb-8">Details can be changed later from the settings page.</p>

      <form id="cardForm">
        <!-- First row: Card Number + Expiration Date -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Card Number -->
          <div class="form-group">
            <label class="label" for="cardNumber">Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              class="input"
              placeholder="16-digit card number"
              maxlength="19"
              required
            >
            <!-- Card type dialog -->
            <p id="cardType" class="text-sm mt-2 text-blue-600 font-medium"></p>
            <!-- Card validation message -->
            <p id="cardValidation" class="text-sm mt-1 text-red-600"></p>
          </div>

          <!-- Expiration Date -->
          <div class="form-group">
            <label class="label" for="expDate">Expiration Date</label>
            <input
              type="text"
              id="expDate"
              name="expDate"
              class="input"
              placeholder="MM/YY"
              maxlength="5"
              required
            >
            <!-- Expiration status dialog -->
            <p id="expiryMessage" class="text-sm mt-2 text-red-600"></p>
          </div>
        </div>
        
        <!-- CVV -->
        <div class="form-group mt-4">
          <label class="label" for="cvv">CVV</label>
          <input
            type="text"
            id="cvv"
            name="cvv"
            class="input"
            placeholder="3-digit number on the back"
            maxlength="4"
            required
          >
        </div>
        <br>
        <button
          type="button"
          id="checkoutBtn"
          class="btn btn-primary w-full mt-6 hover:bg-blue-700 transition duration-300">
          Proceed to Checkout
        </button>
      </form>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script>
    // Store the actual card number separately
    let actualCardNumber = "";
    let isCardNumberFocused = false;

    // --- Mask card number: hash all digits except last 4 ---
    function maskCardNumber(cardNumber) {
      // Keep only digits and limit to 16
      const clean = cardNumber.replace(/\D/g, "").slice(0, 16);

      if (clean.length <= 4) {
        // If 4 or fewer digits, show them all
        return clean.replace(/(.{4})/g, "$1 ").trim();
      }

      // Hash all digits except the last 4
      const hashedPart = clean.slice(0, -4).replace(/\d/g, "#");
      const visiblePart = clean.slice(-4);
      const combined = hashedPart + visiblePart;

      // Format with spaces every 4 characters: "#### #### #### 1234"
      return combined.replace(/(.{4})/g, "$1 ").trim();
    }

    // --- Format card number with spaces (no masking) ---
    function formatCardNumber(cardNumber) {
      const clean = cardNumber.replace(/\D/g, "").slice(0, 16);
      return clean.replace(/(.{4})/g, "$1 ").trim();
    }

    // --- Card type detection ---
    function detectCardType(number) {
      const clean = number.replace(/\D/g, "");
      if (/^4/.test(clean)) return "Visa";
      if (/^5[1-5]/.test(clean)) return "MasterCard";
      if (/^3[47]/.test(clean)) return "American Express";
      if (/^6(?:011|5)/.test(clean)) return "Discover";
      return "";
    }

    // --- Luhn algorithm for card validation ---
    function isValidCardNumber(number) {
      const clean = number.replace(/\D/g, "");
      
      // Must be 13-19 digits (most cards are 16)
      if (clean.length < 13 || clean.length > 19) {
        return false;
      }

      let sum = 0;
      let isEven = false;

      // Loop through digits from right to left
      for (let i = clean.length - 1; i >= 0; i--) {
        let digit = parseInt(clean[i], 10);

        if (isEven) {
          digit *= 2;
          if (digit > 9) {
            digit -= 9;
          }
        }

        sum += digit;
        isEven = !isEven;
      }

      return sum % 10 === 0;
    }

    // --- Expiration check ---
    function isExpired(dateStr) {
      const [monthStr, yearStr] = dateStr.split("/");
      const month = parseInt(monthStr, 10);
      const year = parseInt(yearStr, 10);

      if (!month || !year || month < 1 || month > 12) {
        return true; // treat invalid as expired/blocking
      }

      const now = new Date();
      const currentYear = now.getFullYear() % 100;  // last two digits
      const currentMonth = now.getMonth() + 1;      // 1–12

      if (year < currentYear) return true;
      if (year === currentYear && month < currentMonth) return true;
      return false;
    }

    // --- Hook up DOM elements ---
    const cardNumberInput = document.getElementById("cardNumber");
    const cardTypeDisplay = document.getElementById("cardType");
    const cardValidation = document.getElementById("cardValidation");
    const expDateInput = document.getElementById("expDate");
    const expiryMessage = document.getElementById("expiryMessage");
    const checkoutBtn = document.getElementById("checkoutBtn");

    // Live card type + masking
    cardNumberInput.addEventListener("input", () => {
      const raw = cardNumberInput.value;
      const clean = raw.replace(/\D/g, "").slice(0, 16);

      // Store the actual card number
      actualCardNumber = clean;

      // Show card type dialog (based on real digits, before masking)
      const type = detectCardType(clean);
      if (type) {
        cardTypeDisplay.textContent = `Card Type: ${type}`;
      } else if (clean.length > 0) {
        cardTypeDisplay.textContent = "Unknown card type";
      } else {
        cardTypeDisplay.textContent = "";
      }

      // Clear validation message while typing
      cardValidation.textContent = "";

      // While typing, show all digits formatted with spaces
      if (isCardNumberFocused) {
        cardNumberInput.value = formatCardNumber(clean);
      }
    });

    // When user focuses on the card number field, show all digits
    cardNumberInput.addEventListener("focus", () => {
      isCardNumberFocused = true;
      if (actualCardNumber) {
        cardNumberInput.value = formatCardNumber(actualCardNumber);
      }
      // Clear validation message when focusing
      cardValidation.textContent = "";
    });

    // When user leaves the card number field, apply masking and validate
    cardNumberInput.addEventListener("blur", () => {
      isCardNumberFocused = false;
      if (actualCardNumber) {
        cardNumberInput.value = maskCardNumber(actualCardNumber);
        
        // Validate the card number
        if (actualCardNumber.length > 0 && !isValidCardNumber(actualCardNumber)) {
          cardValidation.textContent = "Invalid card number. Please check and try again.";
        } else {
          cardValidation.textContent = "";
        }
      }
    });

    // Live expiration validation
    expDateInput.addEventListener("input", () => {
      let value = expDateInput.value.replace(/\D/g, "");
      if (value.length >= 3) {
        value = value.slice(0, 4);
        expDateInput.value = value.slice(0, 2) + "/" + value.slice(2);
      } else {
        expDateInput.value = value;
      }

      if (expDateInput.value.length === 5 && isExpired(expDateInput.value)) {
        expiryMessage.textContent = "This card is expired. Please use another card.";
      } else {
        expiryMessage.textContent = "";
      }
    });

    // Prevent progression if expired or invalid card
    checkoutBtn.addEventListener("click", () => {
      // Validate card number first
      if (!actualCardNumber || !isValidCardNumber(actualCardNumber)) {
        cardValidation.textContent = "Please enter a valid card number before proceeding.";
        cardNumberInput.focus();
        return;
      }

      const expVal = expDateInput.value.trim();

      if (!expVal || expVal.length !== 5 || isExpired(expVal)) {
        expiryMessage.textContent = "Cannot proceed with an expired or invalid expiration date.";
        expDateInput.focus();
        return;
      }

      // Clear any previous errors and allow progression
      cardValidation.textContent = "";
      expiryMessage.textContent = "";
      window.location.href = "OrderConfirmationPage.html";
    });
  </script>

  <!-- FOOTER -->
  <footer class="footer"></footer>
  <script src="dist/particles.js"></script>
</body>
</html>
