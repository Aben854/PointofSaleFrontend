<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Information</title>
  <link rel="stylesheet" href="dist/test.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
</head>

<body class="bg-bg text-gray-800 font-sans flex flex-col min-h-screen">
  <!-- HEADER -->
  <header class="header py-4 shadow-md">
    <div class="flex items-center">
      <a href="https://storefrontsolutions.shop/">
        <img
          src="images/logo.png"
          width="260"
          height="75"
          alt="Storefront Solutions"
          class="h-12 ml auto">
      </a>
    </div>
    <div class="container mx-auto flex justify-between items-center"></div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <canvas id="particle-canvas"></canvas>
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h2 class="page-title fade-in-title text-3xl font-semibold text-gray-900 mb-4">
        Enter your card details.
      </h2>
      <p class="text-gray-600 mb-8 subtitle">
        Details can be changed later from the settings page.
      </p>

      <form id="cardForm" class="signup-form space-y-4 text-left">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Card Number -->
          <div class="form-group">
            <label class="label" for="cardNumber">Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              class="input"
              placeholder="16-digit card number"
              maxlength="19"
              required
            >
            <p id="cardType" class="text-sm mt-2 text-blue-600 font-medium"></p>
            <p id="cardValidation" class="text-sm mt-1 text-red-600"></p>
          </div>

          <!-- Expiration Date -->
          <div class="form-group">
            <label class="label" for="expDate">Expiration Date</label>
            <input
              type="text"
              id="expDate"
              name="expDate"
              class="input"
              placeholder="MM/YY"
              maxlength="5"
              required
            >
            <p id="expiryMessage" class="text-sm mt-2 text-red-600"></p>
          </div>
        </div>

        <!-- CVV full width under grid -->
        <div class="form-group">
          <label class="label" for="cvv">CVV</label>
          <input
            type="text"
            id="cvv"
            name="cvv"
            class="input"
            placeholder="3-digit number on the back"
            maxlength="4"
            required
          >
        </div>

        <p id="checkoutMessage" class="text-sm mt-2 text-red-600"></p>
        <button
          type="button"
          id="checkoutBtn"
          class="btn btn primary w-full mt-6">
          Proceed to Checkout
        </button>
      </form>
    </div>

    <script src="dist/particles.js"></script>
  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

  <script>
    // keep real card number here
    let actualCardNumber = "";
    let isCardNumberFocused = false;

    // mask card number except last 4
    function maskCardNumber(cardNumber) {
      const clean = cardNumber.replace(/\D/g, "").slice(0, 16);
      if (clean.length <= 4) {
        return clean.replace(/(.{4})/g, "$1 ").trim();
      }
      const hashedPart = clean.slice(0, -4).replace(/\d/g, "#");
      const visiblePart = clean.slice(-4);
      const combined = hashedPart + visiblePart;
      return combined.replace(/(.{4})/g, "$1 ").trim();
    }

    // format card number with spaces
    function formatCardNumber(cardNumber) {
      const clean = cardNumber.replace(/\D/g, "").slice(0, 16);
      return clean.replace(/(.{4})/g, "$1 ").trim();
    }

    // detect card type
    function detectCardType(number) {
      const clean = number.replace(/\D/g, "");
      if (/^4/.test(clean)) return "Visa";
      if (/^5[1-5]/.test(clean)) return "MasterCard";
      if (/^3[47]/.test(clean)) return "American Express";
      if (/^6(?:011|5)/.test(clean)) return "Discover";
      return "";
    }

    // luhn check
    function isValidCardNumber(number) {
      const clean = number.replace(/\D/g, "");
      if (clean.length < 13 || clean.length > 19) return false;

      let sum = 0;
      let isEven = false;

      for (let i = clean.length - 1; i >= 0; i--) {
        let digit = parseInt(clean[i], 10);
        if (isEven) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        isEven = !isEven;
      }
      return sum % 10 === 0;
    }

    // check if expiration date is in past
    function isExpired(dateStr) {
      const parts = dateStr.split("/");
      if (parts.length !== 2) return true;

      const month = parseInt(parts[0], 10);
      const year = parseInt(parts[1], 10);

      if (!month || !year || month < 1 || month > 12) return true;

      const now = new Date();
      const currentYear = now.getFullYear() % 100;
      const currentMonth = now.getMonth() + 1;

      if (year < currentYear) return true;
      if (year === currentYear && month < currentMonth) return true;
      return false;
    }

    // read cart total from localStorage
    function getCartTotal() {
      try {
        const stored = localStorage.getItem("cartTotal");
        if (!stored) return null;
        const value = parseFloat(stored);
        if (Number.isNaN(value) || value <= 0) return null;
        return value;
      } catch (e) {
        console.warn("Could not read cartTotal:", e);
        return null;
      }
    }

    // read customer id from localStorage
    function getCurrentCustomerId() {
      try {
        const userJson = localStorage.getItem("currentUser");
        if (!userJson) return null;
        const user = JSON.parse(userJson);
        return user.customerId || user.customer_id || user.id || null;
      } catch (e) {
        console.warn("Could not read currentUser:", e);
        return null;
      }
    }

    const cardNumberInput = document.getElementById("cardNumber");
    const cardTypeDisplay = document.getElementById("cardType");
    const cardValidation = document.getElementById("cardValidation");
    const expDateInput = document.getElementById("expDate");
    const expiryMessage = document.getElementById("expiryMessage");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const checkoutMessage = document.getElementById("checkoutMessage");
    const backendBase = "https://pointofsalebackendapi.onrender.com";

    // live formatting + card type
    cardNumberInput.addEventListener("input", () => {
      const raw = cardNumberInput.value;
      const clean = raw.replace(/\D/g, "").slice(0, 16);
      actualCardNumber = clean;

      const type = detectCardType(clean);
      if (type) {
        cardTypeDisplay.textContent = `Card Type: ${type}`;
      } else if (clean.length > 0) {
        cardTypeDisplay.textContent = "Unknown card type";
      } else {
        cardTypeDisplay.textContent = "";
      }

      cardValidation.textContent = "";
      if (isCardNumberFocused) {
        cardNumberInput.value = formatCardNumber(clean);
      }
    });

    cardNumberInput.addEventListener("focus", () => {
      isCardNumberFocused = true;
      if (actualCardNumber) {
        cardNumberInput.value = formatCardNumber(actualCardNumber);
      }
      cardValidation.textContent = "";
    });

    cardNumberInput.addEventListener("blur", () => {
      isCardNumberFocused = false;
      if (actualCardNumber) {
        cardNumberInput.value = maskCardNumber(actualCardNumber);
        if (actualCardNumber.length > 0 && !isValidCardNumber(actualCardNumber)) {
          cardValidation.textContent = "Invalid card number. Please check and try again.";
        } else {
          cardValidation.textContent = "";
        }
      }
    });

    // live expiry formatting
    expDateInput.addEventListener("input", () => {
      let value = expDateInput.value.replace(/\D/g, "");
      if (value.length >= 3) {
        value = value.slice(0, 4);
        expDateInput.value = value.slice(0, 2) + "/" + value.slice(2);
      } else {
        expDateInput.value = value;
      }

      if (expDateInput.value.length === 5 && isExpired(expDateInput.value)) {
        expiryMessage.textContent = "This card is expired. Please use another card.";
      } else {
        expiryMessage.textContent = "";
      }
    });

    // checkout handler
    checkoutBtn.addEventListener("click", async () => {
      checkoutMessage.textContent = "";

      if (!actualCardNumber || !isValidCardNumber(actualCardNumber)) {
        cardValidation.textContent = "Please enter a valid card number before proceeding.";
        cardNumberInput.focus();
        return;
      }

      const expVal = expDateInput.value.trim();
      if (!expVal || expVal.length !== 5 || isExpired(expVal)) {
        expiryMessage.textContent =
          "Cannot proceed with an expired or invalid expiration date.";
        expDateInput.focus();
        return;
      }

      const cvv = document.getElementById("cvv").value.trim();
      if (!cvv || cvv.length < 3) {
        checkoutMessage.textContent = "Please enter a valid CVV.";
        return;
      }

      cardValidation.textContent = "";
      expiryMessage.textContent = "";

      const last4 = actualCardNumber.slice(-4);
      const amount = getCartTotal();
      if (amount === null) {
        checkoutMessage.textContent =
          "We could not find your cart total. Please go back to the storefront.";
        return;
      }

      const customerId = getCurrentCustomerId();
      if (!customerId) {
        checkoutMessage.textContent =
          "We could not find your customer account. Please log in again.";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
        return;
      }

      const orderId = `ORD${Date.now()}`;

      try {
        const resp = await fetch(`${backendBase}/orders/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            orderId,
            customerId,
            amount,
            last4
          })
        });

        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          checkoutMessage.textContent =
            data.error || "Checkout failed. Please try again.";
          return;
        }

        if (data.result === "SUCCESS") {
          try {
            localStorage.setItem("lastOrderId", orderId);
          } catch (e) {
            console.warn("Could not save lastOrderId:", e);
          }
          window.location.href = "OrderConfirmationPage.html";
        } else if (data.result === "INSUFFICIENT_FUNDS") {
          checkoutMessage.textContent =
            "Insufficient funds. Please use a different card.";
        } else if (data.result === "INCORRECT_DETAILS") {
          checkoutMessage.textContent =
            "Card details incorrect. Please check your information.";
        } else {
          checkoutMessage.textContent =
            "Server error. Please try again later.";
        }
      } catch (err) {
        console.error("Error during checkout:", err);
        checkoutMessage.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>
