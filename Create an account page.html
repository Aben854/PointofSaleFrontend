<!DOCTYPE html>
<html lang = "en">

<head>
<meta charset="utf-8">    
    <title>Account Creation</title>
    <link rel="stylesheet" type="text/css" href="../POSFrontend/css/pos2.css">
    <link rel="icon" type="image/x-icon" href="../POSFrontend/pics/cart.ico">
</head>


<body>
  <a href="../POSFrontend/Homepage.html">
  <img src="../POSFrontend/pics/logo.png" alt="Logo" title="basic logo, will be changed" height="auto">
  </a>
<h1> Details can be changed later from the settings page. </h1>
<form action="accountcreation.php" method="POST">
  <h3>Please fill in all details to make an account.</h3>
    <input type="text" name="state" placeholder="State" required> <br>
    <input type="text" name="city" placeholder="City" required> <br>
    <input type="text" name="zip_code" placeholder="Zip Code" required> <br>
    <input type="text" name="address_line1" placeholder="Address Line 1" required> <br>
    <input type="text" name="address_line2" placeholder="Address Line 2" required> <br>
    <input type="text" name="fName" placeholder="First Name" required> <br>
    <input type="text" name="lName" placeholder="Last Name" required> <br>
    <input type="text" name="user_id" placeholder="Create a Username" required> <br>
    <input type="text" name="password" placeholder="Create a Password" required> <br>
    <input type="email" name="email" placeholder="Email Address" required> <br>
  <a href="../POSFrontend/Place an Order Page.html" class="button">Verify email and sign up!</a>
</form>

<img src="../POSFrontend/pics/lock.jpg" alt="filler image" title="so the page doesn't feel empty" width="700px" height="500px " class="top-right">


</body>







</html>
