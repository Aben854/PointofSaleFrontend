<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Creation</title>
  <link rel="stylesheet" href="dist/test.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
</head>

<body class="bg-bg text-gray-800 font-sans flex flex-col min-h-screen">
  <!-- HEADER -->
<header class="header py-4 shadow-md">
      <div class="flex items-center">
      <a href="https://storefrontsolutions.shop/"><img src="images/logo.png"  width=260px height=75px alt="Welcome" class="h-12 ml auto"></a>
    </div>
  <div class="container mx-auto flex justify-between items-center">

</header>

  <!-- BODY -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
    <canvas id="particle-canvas"></canvas>
    <div class="bg-white shadow-soft rounded-xl p-8 w-full max-w-lg">
      <h1 class="page-title fade-in-title text-3xl font-semibold text-gray-900 mb-4">Create Your Account</h1>
      <p class="text-gray-600 mb-8 subtitle">Details can be changed later from the settings page.</p>

<form action="" class="signup-form space-y-4 text-left">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-group">
      <label class="label" for="fName">First Name</label>
      <input type="text" id="fName" name="fName" class="input" placeholder="John" required>
    </div>
    <div class="form-group">
      <label class="label" for="lName">Last Name</label>
      <input type="text" id="lName" name="lName" class="input" placeholder="Doe" required>
    </div>
  </div>

  <div class="form-group">
    <label class="label" for="email">Email Address</label>
    <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required>
  </div>

  <div class="form-group">
    <label class="label" for="user_id">Username</label>
    <input type="text" id="user_id" name="user_id" class="input" placeholder="Create a username" required>
  </div>

  <div class="form-group">
    <label class="label" for="password">Password</label>
    <input type="password" id="password" name="password" class="input" placeholder="Create a password" required>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-group">
      <label class="label" for="state">State</label>
      <input type="text" id="state" name="state" class="input" placeholder="e.g. CA" required>
    </div>
    <div class="form-group">
      <label class="label" for="city">City</label>
      <input type="text" id="city" name="city" class="input" placeholder="Los Angeles" required>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-group">
      <label class="label" for="zip_code">Zip Code</label>
      <input type="text" id="zip_code" name="zip_code" class="input" placeholder="90001" required>
    </div>
    <div class="form-group">
      <label class="label" for="address_line1">Address Line 1</label>
      <input type="text" id="address_line1" name="address_line1" class="input" placeholder="123 Main St" required>
    </div>
  </div>

  <div class="form-group">
    <label class="label" for="address_line2">Address Line 2</label>
    <input type="text" id="address_line2" name="address_line2" class="input" placeholder="Apt 4B">
  </div>
<br>
  <button
    type="button"
    class="btn btn primary  w-full mt-6"
    onclick="window.location.href='Online Storefront Page.html'">
    Verify Email and Sign Up
  </button>
</form>
    </div>
     <script src="dist/particles.js"></script>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
  </footer>
</body>
</html>
